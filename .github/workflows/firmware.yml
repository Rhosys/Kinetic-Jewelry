name: Firmware CI

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "firmware/**"
      - "app/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "app/**"
      - ".github/workflows/firmware.yml"

# ── Job map ───────────────────────────────────────────────────────────────────
#
#   protocol-unit-tests  (Tier 1 – runs now, no extra setup)
#          │
#          ├──► device-ble-integration  (Tier 2 – see TEST-SUITES-SPEC.md §A)
#          │                             Disabled: needs device-host crate + vHCI
#          │
#          └──► kotlin-roundtrip        (Tier 3 – see TEST-SUITES-SPEC.md §B)
#                                        Disabled: needs protocol finalised + vectors
#
# Remove the `if: false` guard from each job when its prerequisites are met.

jobs:

  # ── Tier 1: Protocol unit tests ─────────────────────────────────────────────
  # Pure Rust, no hardware, no ESP toolchain. Runs on every push.
  protocol-unit-tests:
    name: "Protocol – unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/protocol -> target

      - name: cargo test
        working-directory: firmware/protocol
        run: cargo test --verbose

  # ── Tier 2: Device BLE integration (virtual HCI) ────────────────────────────
  # firmware/device-host/ — native Linux BLE peripheral (bluer) + MockGpio.
  # Both peripheral and central run on a single virtual hci0 adapter via BlueZ
  # loopback.  No physical Bluetooth hardware required.
  device-ble-integration:
    name: "Device – BLE integration (virtual HCI)"
    runs-on: ubuntu-latest
    needs: protocol-unit-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install BlueZ and D-Bus dev headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bluez libdbus-1-dev pkg-config

      - name: Grant CI user access to BlueZ D-Bus service
        run: |
          # Write a policy that lets the current (non-root) user call BlueZ
          # methods directly — avoids needing `sudo cargo test` at test time.
          sudo tee /etc/dbus-1/system.d/bluetooth-ci.conf > /dev/null << POLICY
          <!DOCTYPE busconfig PUBLIC
           "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
           "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
          <busconfig>
            <policy user="$(id -un)">
              <allow own="org.bluez"/>
              <allow send_destination="org.bluez"/>
              <allow send_interface="org.bluez.Adapter1"/>
              <allow send_interface="org.bluez.Device1"/>
              <allow send_interface="org.bluez.GattManager1"/>
              <allow send_interface="org.bluez.LEAdvertisingManager1"/>
              <allow send_interface="org.freedesktop.DBus.ObjectManager"/>
              <allow send_interface="org.freedesktop.DBus.Properties"/>
              <allow send_interface="org.freedesktop.DBus.Introspectable"/>
            </policy>
          </busconfig>
          POLICY
          sudo systemctl reload dbus

      - name: Load virtual HCI kernel module and start BlueZ
        run: |
          sudo modprobe hci_vhci || true
          sudo systemctl start bluetooth || true
          sleep 5
          sudo hciconfig hci0 up || true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            firmware/protocol -> target
            firmware/device-host -> target

      - name: Build device-host
        working-directory: firmware/device-host
        run: cargo build

      - name: Run BLE integration tests
        working-directory: firmware/device-host
        run: cargo test --test ble_integration -- --nocapture --test-threads=1

  # ── Tier 3: Kotlin ↔ Rust protocol round-trip ────────────────────────────────
  # Both sides read the same test-vectors.json. When the protocol changes,
  # update that file and both sides in the same PR — CI enforces agreement.
  kotlin-roundtrip:
    name: "Protocol – Kotlin ↔ Rust round-trip"
    runs-on: ubuntu-latest
    needs: protocol-unit-tests
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/protocol -> target

      # setup-gradle reads gradle/wrapper/gradle-wrapper.properties to resolve
      # the Gradle version and downloads the wrapper JAR if it is not committed.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Rust – round-trip vectors test
        working-directory: firmware/protocol
        run: cargo test --test roundtrip --verbose

      - name: Kotlin – round-trip vectors test
        run: ./gradlew :app:testDebugUnitTest --tests "*.ProtocolRoundtripTest"
