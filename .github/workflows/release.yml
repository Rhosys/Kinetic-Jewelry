# Builds a signed release AAB for manual upload to Google Play.
#
# Trigger: manually via workflow_dispatch, or automatically on push to main.
#
# Required GitHub Secrets:
#   ANDROID_KEYSTORE_B64      — base64-encoded PKCS12 keystore file
#   ANDROID_KEYSTORE_PASSWORD — keystore + key password (same value, alias: lyra)
#
# To generate the keystore (run once, locally):
#   keytool -genkey -v -keystore lyra-upload.keystore -alias lyra \
#     -keyalg RSA -keysize 4096 -validity 10950 \
#     -dname "CN=rhosys.ch, O=Rhosys AG, OU=Mobile, C=CH"
#   base64 -w 0 lyra-upload.keystore
#
# Store the base64 output as ANDROID_KEYSTORE_B64 and the password as
# ANDROID_KEYSTORE_PASSWORD in Settings → Secrets → Actions.
#
# Download the AAB from the Actions run → Artifacts → app-release-aab,
# then upload to Play Console → Internal Testing → Create new release.

name: Release Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

jobs:
  build-release:
    name: Build signed release AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > app/android-upload-signing.keystore

      - name: Build signed release AAB
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/app/android-upload-signing.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="lyra" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
