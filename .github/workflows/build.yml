# Mirrors the validate/test stages of .gitlab-ci.yml for GitHub Actions.
# Build-release and deploy live exclusively in GitLab CI (signing + Play Store).

name: Android CI

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths-ignore:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

jobs:
  # ── Validate ────────────────────────────────────────────────────────────────

  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile debug Kotlin
        run: ./gradlew compileDebugKotlin

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Lint debug
        run: ./gradlew lintDebug

  # ── Test ────────────────────────────────────────────────────────────────────

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [compile]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
