[package]
name    = "kinetic-jewel"
version = "0.1.0"
edition = "2021"

[[bin]]
name    = "kinetic-jewel"
harness = false   # no test harness – embedded binary

[profile.release]
opt-level = "s"   # optimise for size

[dependencies]
# Host-testable protocol layer (pure Rust, no esp-idf)
kinetic-protocol = { path = "../protocol" }
# ESP-IDF standard library layer
esp-idf-svc = { version = "0.49", features = ["std"] }
esp-idf-hal = "0.44"
# Rust-native NimBLE wrapper (BLE peripheral stack)
esp32-nimble = "0.7"
# Error propagation
anyhow = "1"
log    = "0.4"

[build-dependencies]
embuild = "0.32"
