[platformio]
default_envs = esp32-c3-mini

; ── ESP32-C3 Super Mini / DevKitM-1 (recommended – smallest BLE module) ─────
[env:esp32-c3-mini]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino
lib_deps  =
    h2zero/NimBLE-Arduino @ ^1.4.2
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
build_flags     =
    -DCORE_DEBUG_LEVEL=1

; ── ESP32-WROOM-32 (classic DevKit, larger footprint) ───────────────────────
[env:esp32-wroom]
platform  = espressif32
board     = esp32dev
framework = arduino
lib_deps  =
    h2zero/NimBLE-Arduino @ ^1.4.2
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
build_flags     =
    -DCORE_DEBUG_LEVEL=1
    -DPIN_MOTOR=25
    -DPIN_LED=26
